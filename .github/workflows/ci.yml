name: ci

permissions:
  contents: read

# Runs on every push and PR, unlike release.yml (which only fires on a v*
# tag) — so a broken commit fails here long before anyone tags a release.
# macOS is in the matrix on purpose: le's own ps/lsof parsing is
# macOS-first, and release.yml's Linux-only test run never actually
# exercises this code on the platform it's designed for.
#
# Windows is in the matrix for the mirror-image reason: nobody develops le on
# Windows, so this job is the ONLY place the netstat / Win32_Process / taskkill
# glue ever runs for real. The parsers behind it are untagged and tested
# everywhere; what this runner adds is the spawning (scan/scan_live_test.go,
# kill/stillsame_live_test.go, tools/exit_open_test.go). The cross job below
# is the fast half of that signal: a Windows compile break shows up on ubuntu
# in seconds instead of after the windows-latest queue.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    if: github.event.repository.private == false
    timeout-minutes: 20
    # MongoDB 8.0 rejects the 7.0.0 Azure kernel in current 24.04/26.04
    # images. 22.04 currently provides compatible 6.8. Revisit this pin when
    # hosted kernels reach Mongo's supported 7.0.14+/7.1+ range, before 22.04
    # runner retirement. Never bypass Mongo's startup/kernel safety guard.
    # https://github.com/docker-library/mongo/issues/765
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build portable CLI for isolated engine fixtures
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$RUNNER_TEMP/le-database-fixture" .
      - name: Fixture harness self-check
        run: python3 .github/scripts/database-integration.py --self-test
      - name: Real database and vendor backup journeys
        timeout-minutes: 15
        run: python3 .github/scripts/database-integration.py "$RUNNER_TEMP/le-database-fixture"

  test:
    if: github.event.repository.private == false
    timeout-minutes: 20
    strategy:
      # Each OS reports on its own. With fail-fast, one platform's failure
      # cancels the others mid-run and hides their result — which is exactly
      # the information a three-OS matrix exists to produce.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The gofmt and man-page steps are bash; the windows runner would
        # otherwise hand them to pwsh and fail on the first $(...).
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Homebrew tap preflight regressions
        if: runner.os == 'Linux'
        run: python3 .github/scripts/test-tap-preflight.py

      - name: Fuzz crash reporting regressions
        if: runner.os == 'Linux'
        run: python3 .github/scripts/test-fuzz-crash-report.py

      - name: Release snapshot validator regressions
        if: runner.os == 'Linux'
        run: python3 .github/scripts/test-release-snapshot.py

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false

      - name: Install GoReleaser
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.16.0'
          install-only: true

      - name: Check GoReleaser configuration
        if: runner.os == 'Linux'
        run: |
          # Fail closed even if the installer could not download checksums.txt.
          goreleaser_path="$(command -v goreleaser)"
          printf '%s  %s\n' '00b06a2f8de8711ade37289b2cb61887936a8b04745414c5b23298fc8e9e3dfd' "$goreleaser_path" | sha256sum --check --strict -
          # v2.16.0: exit 2 means valid config with deprecated properties.
          # `brews` is intentional: our Formula serves both macOS and Linux.
          # Invalid configuration takes exit 1 even when also deprecated.
          check_status=0
          goreleaser check || check_status=$?
          case "$check_status" in
            0) ;;
            2) echo "::notice::Accepting the documented legacy brews Formula deprecation; schema validation passed." ;;
            *) exit "$check_status" ;;
          esac

      - name: Package release snapshot
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          # No credentials are supplied. Snapshot skips publish/announce, and
          # --skip=publish makes that boundary explicit. No artifact upload.
          goreleaser release --snapshot --clean --skip=publish --timeout=10m --parallelism=2
          python3 .github/scripts/verify-release-snapshot.py

      - name: gofmt
        # Not on Windows: actions/checkout there honours core.autocrlf, so
        # every .go file arrives with CRLF endings and gofmt -l lists the
        # entire tree. Formatting is a property of the source, not the OS;
        # ubuntu and macOS check it. (Same reason the man-page step skips.)
        if: runner.os != 'Windows'
        run: |
          fmt="$(gofmt -l .)"
          if [ -n "$fmt" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: Repeated database deadline regressions
        run: go test -race ./datacenter/database -run 'Test(DatabaseDeadlineClassification|RedisRESP2ReadAndBoundedCancellation)' -count=50

      - name: Patched driver safety regressions
        run: |
          (cd third_party/mysql && go test -race ./...)
          (cd third_party/scram && go test -race ./...)

      # The committed man/ pages are what ship inside the release tarball and
      # what brew installs, but regenerating them was a manual "run gendocs and
      # commit the diff" step — which is exactly the step that got skipped, so
      # eleven commands shipped with no man page at all. Fail here instead.
      # gendocs pins its date (internal/gendocs/main.go), so a dirty tree means
      # real content drift, never just a month rollover.
      - name: man pages are up to date
        # Not on Windows: the pages are generated identically there (gendocs
        # asks for every command regardless of OS), but core.autocrlf on the
        # runner would report every file as modified. ubuntu and macOS cover it.
        if: runner.os != 'Windows'
        run: |
          go run ./internal/gendocs
          # --porcelain covers all three drift shapes: modified (usage text
          # changed), untracked (a new command), and deleted (a removed one —
          # gendocs clears man/ first, so an orphaned page shows up as a
          # deletion instead of sitting there tracked and unmodified).
          if [ -n "$(git status --porcelain -- man/)" ]; then
            echo "man/ is stale — run 'go run ./internal/gendocs' and commit the result:"
            git add --intent-to-add -- man/
            python3 - <<'PYDOC'
          import base64, subprocess
          patch = subprocess.run(["git", "diff", "--no-ext-diff", "HEAD", "--", "man/"], check=True, capture_output=True, timeout=10).stdout
          if len(patch) > 262144:
              raise SystemExit("Manual diff exceeds reporting limit")
          print("LE_MAN_PATCH_BASE64=" + base64.b64encode(patch).decode("ascii"))
          PYDOC
            exit 1
          fi

  # Cross-compile check: the cheapest possible Windows signal. `go vet` under
  # GOOS=windows type-checks every build-tagged file AND the test files, so a
  # unix-only symbol leaking into an untagged test breaks here, on ubuntu, in
  # seconds — without waiting for a Windows runner.
  cross:
    if: github.event.repository.private == false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: windows/amd64
        run: GOOS=windows GOARCH=amd64 go build ./... && GOOS=windows GOARCH=amd64 go vet ./...
      - name: windows/arm64
        run: GOOS=windows GOARCH=arm64 go build ./... && GOOS=windows GOARCH=arm64 go vet ./...

  lint:
    if: github.event.repository.private == false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false

      # Pinned, not @latest: a linter version bump can add new default
      # checks and turn CI red on a commit that didn't actually change
      # anything. Bump deliberately (and re-run `golangci-lint run ./...`
      # locally first) rather than letting it happen silently.
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: lint
        run: golangci-lint run ./...
