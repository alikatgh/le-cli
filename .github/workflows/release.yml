name: release

# Cuts a GitHub release when a v* tag is pushed. goreleaser builds the 4
# platform tarballs (binary + man pages), checksums.txt, and the release —
# and, when TAP_GITHUB_TOKEN passes the bounded tap-access preflight
# (contents:write on alikatgh/homebrew-tap), also pushes the updated
# formula to the tap, replacing the error-prone hand-edit of four sha256s
# per release. Without usable tap access the tap step is skipped and the bump
# stays manual (see RELEASING.md).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write     # for build-provenance attestation (GitHub OIDC)
  attestations: write

jobs:
  # Gate the release on tests passing on BOTH platforms with -race. le's
  # ps/lsof parsing is macOS-first, so a macOS-only regression must not reach a
  # tagged binary — the ubuntu-only, no-race release test missed both. (LE-562/563)
  test:
    if: github.event.repository.private == false
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test
        run: go test -race ./...
      - name: Patched driver safety regressions
        run: |
          (cd third_party/mysql && go test -race ./...)
          (cd third_party/scram && go test -race ./...)

  release:
    if: github.event.repository.private == false
    needs: test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Use the same supported CLI compiler as CI and the release test matrix.
      # GoReleaser itself is installed separately as its official OSS binary.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false

      # Install the official OSS binary; compiling the release tool's separate
      # dependency graph broke v0.1.26 before any CLI archives were built.
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.16.0'
          install-only: true

      - name: Check Homebrew tap access
        id: tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: bash .github/scripts/tap-preflight.sh

      # Pinned goreleaser version so releases are reproducible run-over-run;
      # bump deliberately. (`brews` is deprecated upstream — see the note in
      # .goreleaser.yaml for why we stay on it for now.)
      - name: Release via goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          # The installer can skip checksum verification if its checksum download
          # fails. Verify the pinned Linux x86_64 executable before executing it.
          goreleaser_path="$(command -v goreleaser)"
          printf '%s  %s\n' '00b06a2f8de8711ade37289b2cb61887936a8b04745414c5b23298fc8e9e3dfd' "$goreleaser_path" | sha256sum --check --strict -
          if [ "${{ steps.tap.outputs.ready }}" = "true" ]; then
            goreleaser release --clean
          else
            echo "::warning::Homebrew tap access preflight did not pass — publishing the release WITHOUT updating the tap. Bump it manually per RELEASING.md."
            # Recorded, not exited on: the release must still publish and the
            # attestation step below must still run. The job is failed at the
            # end instead — see "Tap was not updated".
            echo "TAP_SKIPPED=1" >> "$GITHUB_ENV"
            TAP_GITHUB_TOKEN="" goreleaser release --clean --skip=homebrew
          fi

      # Cryptographic build provenance, verifiable with `gh attestation verify
      # <tarball> --repo alikatgh/le-cli`. GitHub-native (OIDC) — no external
      # service. Also runs if GoReleaser fails after building/uploading archives;
      # a later tap error must not prevent provenance for those archives. A red
      # job can still have a published release: inspect the actual release state.
      - name: Attest build provenance
        if: ${{ !cancelled() && hashFiles('dist/*.tar.gz', 'dist/*.zip') != '' }}
        uses: actions/attest-build-provenance@v4
        with:
          # Every archive, not just the tarballs: 0.1.25 shipped the first
          # Windows zips and `gh attestation verify le_*.zip` 404'd on them,
          # because this glob predated zips. A Windows user had no way to
          # check their download came from this CI. (LE-CLI-020)
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # A skipped tap bump used to be a green run with one line buried in the
      # log — so v0.1.16 shipped and brew users stayed on v0.1.15 for a month
      # without anyone noticing. Missing or unusable tap access must not pass
      # quietly, including rejected credentials and inconclusive preflight checks.
      # Deliberately last: the release is already published and attested, so
      # this fails the run without costing anything — the same trade the
      # attestation step above documents.
      - name: Tap was not updated
        if: env.TAP_SKIPPED == '1'
        run: |
          echo "::error::Release published, but the Homebrew tap was NOT updated (tap access preflight did not pass)."
          echo "Check TAP_GITHUB_TOKEN and access to the tap's unprotected default branch."
          echo "If the token needs replacing, use a fine-grained PAT with contents:write on alikatgh/homebrew-tap"
          echo "and 'gh secret set TAP_GITHUB_TOKEN --repo alikatgh/le-cli'."
          echo "Bump Formula/le.rb by hand for THIS release per RELEASING.md."
          exit 1
