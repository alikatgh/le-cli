name: release

# Cuts a GitHub release when a v* tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write     # for build-provenance attestation (GitHub OIDC)
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Test
        run: go test ./...

      - name: Build release artifacts
        run: ./build-release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "le $VER" \
            --notes "Prebuilt \`le\` binaries for macOS and Linux (amd64 + arm64). See README.md." \
            dist/*.tar.gz dist/checksums.txt

      # Cryptographic build provenance, verifiable with `gh attestation verify
      # <tarball> --repo alikatgh/le-cli`. GitHub-native (OIDC) — no external
      # service. Runs AFTER the release is published, so a hiccup here can
      # never un-publish the binaries; worst case the job goes red with the
      # release already live.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*.tar.gz'
