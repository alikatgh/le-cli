name: release

# Cuts a GitHub release when a v* tag is pushed. goreleaser builds the 4
# platform tarballs (binary + man pages), checksums.txt, and the release —
# and, when the TAP_GITHUB_TOKEN secret is configured (a fine-grained PAT
# with contents:write on alikatgh/homebrew-tap), also pushes the updated
# formula to the tap, replacing the error-prone hand-edit of four sha256s
# per release. Without the secret the tap step is skipped and the bump
# stays manual (see RELEASING.md).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write     # for build-provenance attestation (GitHub OIDC)
  attestations: write

jobs:
  # Gate the release on tests passing on BOTH platforms with -race. le's
  # ps/lsof parsing is macOS-first, so a macOS-only regression must not reach a
  # tagged binary — the ubuntu-only, no-race release test missed both. (LE-562/563)
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Test
        run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # goreleaser v2.16.0's go.mod demands go >= 1.26.3, and setup-go@v6
      # exports GOTOOLCHAIN=local, which forbids the automatic toolchain
      # download that used to paper over the gap — so the release job needs
      # the newer Go explicitly. The test matrix stays on 1.24 to match
      # go.mod, proving the module still builds at its declared floor.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # Pinned goreleaser version so releases are reproducible run-over-run;
      # bump deliberately. (`brews` is deprecated upstream — see the note in
      # .goreleaser.yaml for why we stay on it for now.)
      - name: Release via goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$TAP_GITHUB_TOKEN" ]; then
            go run github.com/goreleaser/goreleaser/v2@v2.16.0 release --clean
          else
            echo "::warning::TAP_GITHUB_TOKEN missing or expired — publishing the release WITHOUT updating the Homebrew tap. Bump it manually per RELEASING.md."
            # Recorded, not exited on: the release must still publish and the
            # attestation step below must still run. The job is failed at the
            # end instead — see "Tap was not updated".
            echo "TAP_SKIPPED=1" >> "$GITHUB_ENV"
            TAP_GITHUB_TOKEN="" go run github.com/goreleaser/goreleaser/v2@v2.16.0 release --clean --skip=homebrew
          fi

      # Cryptographic build provenance, verifiable with `gh attestation verify
      # <tarball> --repo alikatgh/le-cli`. GitHub-native (OIDC) — no external
      # service. Runs AFTER the release is published, so a hiccup here can
      # never un-publish the binaries; worst case the job goes red with the
      # release already live.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*.tar.gz'

      # A skipped tap bump used to be a green run with one line buried in the
      # log — so v0.1.16 shipped and brew users stayed on v0.1.15 for a month
      # without anyone noticing. Now that the secret exists, its absence means
      # it EXPIRED, which is exactly the case that must not pass quietly.
      # Deliberately last: the release is already published and attested, so
      # this fails the run without costing anything — the same trade the
      # attestation step above documents.
      - name: Tap was not updated
        if: env.TAP_SKIPPED == '1'
        run: |
          echo "::error::Release published, but the Homebrew tap was NOT updated (TAP_GITHUB_TOKEN missing or expired)."
          echo "brew users are still on the previous version. Fix: re-create the fine-grained PAT"
          echo "(contents:write on alikatgh/homebrew-tap), 'gh secret set TAP_GITHUB_TOKEN --repo alikatgh/le-cli',"
          echo "and bump Formula/le.rb by hand for THIS release per RELEASING.md."
          exit 1
