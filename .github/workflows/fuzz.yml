name: fuzz

# The fuzz harnesses (scan/fuzz_test.go, intel/fuzz_test.go) run only their
# seed corpus during normal `go test` in ci.yml — that catches regressions on
# known inputs but never explores new ones. This runs the actual fuzzer on a
# schedule so it keeps hunting for inputs that crash the ps/lsof/docker
# parsers, and surfaces any crasher as a failed job + lossless corpus in the
# workflow log/summary, without metered Actions artifact storage.

on:
  schedule:
    - cron: "0 6 * * *" # nightly, ~06:00 UTC
  workflow_dispatch:

concurrency:
  group: fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one crashing target must not cancel the others
      matrix:
        include:
          - { pkg: ./scan/, fn: FuzzParsePSUserLines }
          - { pkg: ./scan/, fn: FuzzParsePSCommandLines }
          - { pkg: ./scan/, fn: FuzzPortOf }
          - { pkg: ./intel/, fn: FuzzParseDockerPorts }
          - { pkg: ./intel/, fn: FuzzBrewFormula }
          - { pkg: ./intel/, fn: FuzzWordMatch }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"

      - name: fuzz ${{ matrix.fn }}
        run: go test -run '^$' -fuzz='^${{ matrix.fn }}$' -fuzztime=180s ${{ matrix.pkg }}

      - name: report crash corpus
        if: failure()
        run: python3 .github/scripts/report-fuzz-crash.py report --package '${{ matrix.pkg }}' --target '${{ matrix.fn }}'
